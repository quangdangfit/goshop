environment: production
http_port: 8888
grpc_port: 8889
auth_secret: ######

database_uri: postgres://username:password@host:5432/database

redis_uri: localhost:6379
redis_password:
redis_db: 0

# CORS / rate limiting (optional — defaults: "*", 100 req / 60s)
cors_allowed_origins: "*"
rate_limit_requests: 100
rate_limit_window_seconds: 60

# Auth mode: "jwt" (default) or "oidc"
auth_mode: jwt

# OIDC / Authentik — only required when auth_mode = oidc
oidc_issuer: https://auth.cunghoclaptrinh.online/application/o/goshop-api/
oidc_client_id: goshop-api-client
oidc_client_secret: ######
oidc_redirect_url: https://goshop.cunghoclaptrinh.online/api/v1/auth/callback
oidc_jwks_url: https://auth.cunghoclaptrinh.online/application/o/goshop-api/jwks/
oidc_scopes: openid,email,profile
# Where the OIDC callback redirects the browser after minting GoShop tokens.
frontend_base_url: https://goshop.cunghoclaptrinh.online

# Stripe — required for payments. webhook_secret is given by `stripe listen`
# or the dashboard; api_base is only set in tests to point at stripe-mock.
stripe_secret_key: sk_test_xxx
stripe_webhook_secret: whsec_xxx
stripe_publishable_key: pk_test_xxx
stripe_api_base:

# SMTP — required for transactional email (order receipts, etc.).
# In dev, point at MailHog: smtp_host=localhost, smtp_port=1025.
smtp_host:
smtp_port: 25
smtp_user:
smtp_password:
email_from: no-reply@goshop.local
